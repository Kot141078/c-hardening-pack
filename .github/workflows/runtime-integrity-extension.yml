name: Runtime integrity extension

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-runtime-integrity.txt
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-runtime-integrity.txt
      - name: Validate schemas and fixtures
        run: python tools/validate_runtime_integrity_extension.py --verbose
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_runtime_integrity_extension.py" -v
